# 放在 http 上下文。由 install.sh 复制到 /etc/nginx/conf.d/ispweb-security.conf

server_tokens off;
client_max_body_size 2m;
client_body_timeout 30s;
client_header_timeout 15s;
send_timeout 30s;
keepalive_timeout 30s;
underscores_in_headers off;
ignore_invalid_headers on;
merge_slashes on;
reset_timedout_connection on;

limit_req_zone $binary_remote_addr zone=ispweb_web:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ispweb_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=ispweb_conn:10m;
limit_req_status 429;
limit_conn_status 429;

map $http_upgrade $ispweb_connection_upgrade {
    default upgrade;
    ''      close;
}

# map 正则里不能写 {n}，花括号会被 Nginx 当成配置块。
map $host $ispweb_ip_host {
    default 0;
    ""      1;
    ~^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ 1;
    ~^[0-9a-fA-F]*:[0-9a-fA-F:]+$ 1;
}

map $uri $ispweb_log_uri {
    ~^/_gws/  /_gws/;
    ~^/_g/    /_g/;
    default   $uri;
}

log_format ispweb_safe '$remote_addr - $host [$time_local] '
                       '"$request_method $ispweb_log_uri $server_protocol" '
                       '$status $body_bytes_sent';
